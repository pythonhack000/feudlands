<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feudlands</title>
<script type="module" src="./fonts.ts"></script>
<style>
  :root { --parchment: #efe3c8; --ink: #3a2a1c; --ink-soft: #7a6347; --a: #2f5d8a; --b: #b5452f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--parchment); color: var(--ink); font-family: 'IM Fell English', Georgia, serif; display: flex; justify-content: center; }
  main { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; position: relative; }
  header { padding: 12px 16px 6px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-family: 'IM Fell English SC', serif; font-size: 18px; letter-spacing: .04em; color: var(--ink-soft); }
  .day { font-style: italic; color: var(--ink-soft); font-size: 15px; }
  h1 { font-weight: 400; font-size: 30px; line-height: 1.05; margin: 2px 0 8px; }
  .tug { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .tug .side { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .tug .side.b { flex-direction: row-reverse; }
  .rope { flex: 1; height: 10px; position: relative; border: 1px solid rgba(58,42,28,.5); border-radius: 2px; overflow: hidden; background: var(--b); }
  .rope span { position: absolute; inset: 0 auto 0 0; background: var(--a); transition: width .6s ease; }
  .rope::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink); opacity: .6; }
  .pct { font-variant-numeric: tabular-nums; }
  .you { font-style: italic; color: var(--ink-soft); font-size: 14px; margin-top: 4px; min-height: 40px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  .ballot { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 4px; }
  .ballot button { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: inherit; text-align: left; color: var(--ink); background: none; border: 1px solid rgba(58,42,28,.35); padding: 8px 12px; cursor: pointer; }
  .ballot button[aria-pressed="true"] { border-color: var(--ink); background: rgba(58,42,28,.07); }
  .ballot small { font-style: italic; color: var(--ink-soft); white-space: nowrap; }
  .you #rank { display: block; min-height: 19px; white-space: normal; }
  .map-wrap { position: relative; flex: 1; min-height: 0; }
  canvas#map { display: block; width: 100%; height: 100%; touch-action: none; }
  .tip { position: absolute; pointer-events: none; background: rgba(239,227,200,.95); border: 1px solid var(--ink-soft); padding: 4px 8px; font-size: 15px; white-space: nowrap; transform: translate(-50%, -120%); display: none; }
  .tray { padding: 6px 12px 14px; }
  /* Wide, short windows (a post on desktop): the map takes the left, everything else stacks on the right. */
  @media (min-width: 600px) and (min-aspect-ratio: 1/1) {
    main { max-width: 1180px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "map header" "map tray"; }
    header { grid-area: header; }
    .map-wrap { grid-area: map; }
    .tray { grid-area: tray; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 16px 16px; }
    .feed { height: auto; max-height: 96px; }
  }
  .feed { list-style: none; margin: 0 0 6px; padding: 0; font-size: 15px; height: 56px; overflow: hidden; }
  .feed li { display: flex; gap: 6px; align-items: baseline; line-height: 1.2; animation: inkin .5s ease-out; }
  .feed li:nth-child(2) { opacity: .7; } .feed li:nth-child(3) { opacity: .45; }
  .feed em { margin-left: auto; font-style: normal; }
  @keyframes inkin { from { opacity: 0; transform: translateY(6px); } }
  .status { text-align: center; font-style: italic; color: var(--ink-soft); font-size: 15px; margin: 0 0 8px; min-height: 19px; }
  .cards { display: flex; gap: 8px; }
  .card { min-width: 0; }
  .card { flex: 1; background: rgba(255,250,236,.55); border: 1px solid rgba(58,42,28,.35); padding: 6px 6px 8px; text-align: center; cursor: pointer; font: inherit; color: inherit; transition: transform .15s, border-color .15s; }
  .card canvas { width: 56px; height: 56px; margin: 0 auto; display: block; }
  .card b { display: block; font-family: 'IM Fell English SC', serif; font-weight: 400; font-size: 18px; }
  .card .count { font-family: 'IM Fell English', serif; font-size: 16px; color: var(--ink-soft); }
  .card small { display: block; font-size: 13px; line-height: 1.15; color: var(--ink-soft); }
  .card[aria-pressed="true"] { border-color: var(--ink); transform: translateY(-4px); box-shadow: 0 6px 14px -10px var(--ink); }
  .card:disabled { opacity: .4; cursor: default; }
  .card:focus-visible, .pick button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* Choosing a side */
  .pick { position: absolute; inset: 0; background: rgba(239,227,200,.97); display: flex; flex-direction: column; justify-content: center; padding: 28px; gap: 18px; text-align: center; z-index: 5; }
  .pick .q { font-size: 34px; line-height: 1.1; margin: 0; }
  .pick p { margin: 0; color: var(--ink-soft); font-style: italic; }
  .pick .sides { display: flex; gap: 14px; }
  .pick button { flex: 1; border: 1.5px solid var(--ink); background: rgba(255,250,236,.6); padding: 16px 8px 14px; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform .15s; }
  .pick button:hover { transform: translateY(-3px); }
  .pick button svg { width: 54px; height: 64px; }
  .pick button b { font-family: 'IM Fell English SC', serif; font-weight: 400; font-size: 24px; }
  .pick button small { color: var(--ink-soft); font-size: 14px; }
  .pick .next { font-size: 15px; }
  .brag { display: flex; gap: 10px; align-items: baseline; margin-top: 6px !important; font-size: 13px !important; }
  .rules ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 17px; line-height: 1.3; }
  .rules b { font-weight: 400; font-family: 'IM Fell English SC', serif; }
  .sheet .go { align-self: flex-start; font: inherit; font-size: 18px; color: var(--parchment); background: var(--ink); border: 0; padding: 8px 20px; cursor: pointer; }
  .coach { border-left: 3px solid var(--ink); background: rgba(255,250,236,.6); padding: 8px 10px; margin: 0 0 8px; display: flex; gap: 10px; align-items: flex-start; }
  .coach p { margin: 0; font-size: 15px; line-height: 1.3; flex: 1; }
  .coach b { display: block; font-weight: 400; font-family: 'IM Fell English SC', serif; font-size: 16px; }
  .coach button { font: inherit; font-size: 13px; font-style: italic; color: var(--ink-soft); background: none; border: 0; border-bottom: 1px solid var(--ink-soft); padding: 0; cursor: pointer; white-space: nowrap; }
  .day-end { text-align: center; margin: -4px 0 10px; }
  .day-end button { font: inherit; font-size: 17px; color: var(--ink); background: rgba(255,250,236,.55); border: 1px solid var(--ink); padding: 6px 16px; cursor: pointer; }
  .day-end button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .you button { font: inherit; font-style: italic; color: var(--ink); background: none; border: 0; padding: 0 0 1px; margin-right: 12px; border-bottom: 1px solid var(--ink-soft); cursor: pointer; }
  .sheet { position: absolute; inset: 0; background: var(--parchment); z-index: 6; display: flex; flex-direction: column; padding: 16px; gap: 10px; overflow-y: auto; }
  .sheet header { padding: 0; display: flex; justify-content: space-between; align-items: baseline; }
  .sheet h2 { font-weight: 400; font-size: 26px; margin: 0; }
  .sheet .close { font: inherit; background: none; border: 0; border-bottom: 1px solid var(--ink-soft); cursor: pointer; color: var(--ink); }
  .sheet p { margin: 0; color: var(--ink-soft); font-style: italic; font-size: 15px; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .banner { border: 1px solid rgba(58,42,28,.3); background: rgba(255,250,236,.5); padding: 24px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
  .banner canvas { width: 90px; height: 108px; }
  .banner .by { font-size: 14px; }
  .banner .flying { position: absolute; top: 5px; left: 0; right: 0; text-align: center; font-size: 12px; font-style: italic; color: var(--ink-soft); }
  .vote { font: inherit; font-size: 15px; background: none; border: 1px solid rgba(58,42,28,.4); padding: 2px 10px; cursor: pointer; color: var(--ink); font-variant-numeric: tabular-nums; }
  .vote[aria-pressed="true"] { background: var(--ink); color: var(--parchment); }
  .easel { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .easel canvas { width: 200px; height: 240px; touch-action: none; cursor: crosshair; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { font: inherit; font-size: 14px; background: rgba(255,250,236,.6); border: 1px solid rgba(58,42,28,.35); padding: 4px 9px; cursor: pointer; color: var(--ink); }
  .chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--ink); cursor: pointer; }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
  .council { display: flex; flex-direction: column; gap: 8px; }
  .arg { display: flex; gap: 10px; align-items: flex-start; border-left: 4px solid; padding: 6px 0 6px 10px; background: rgba(255,250,236,.45); }
  .arg q { font-size: 17px; line-height: 1.25; quotes: '\201C' '\201D'; }
  .arg small { display: block; color: var(--ink-soft); font-style: italic; font-size: 13px; margin-top: 2px; }
  .rally { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rally div { border: 1px solid rgba(58,42,28,.3); padding: 8px; text-align: center; }
  .rally b { display: block; font-family: 'IM Fell English SC', serif; font-weight: 400; font-size: 20px; }
  .write { display: flex; gap: 8px; }
  .write input { flex: 1; font: inherit; font-size: 16px; padding: 8px; border: 1px solid rgba(58,42,28,.5); background: rgba(255,250,236,.7); color: var(--ink); }
  .raise { font: inherit; font-family: 'IM Fell English SC', serif; font-size: 20px; background: var(--ink); color: var(--parchment); border: 0; padding: 8px 22px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .feed li { animation: none; } .rope span { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="top"><span class="brand">Feudlands</span><span class="day">Day <span id="dayNo">12</span>, <span id="here">1</span> at war</span></div>
    <h1 id="question">Cats or dogs?</h1>
    <div class="tug">
      <span class="side a"><svg width="14" height="17" viewBox="0 0 54 64"><path d="M4 2h46v30c0 16-12 26-23 30C16 58 4 48 4 32z" fill="#2f5d8a"/></svg><span id="nameA">Cats</span> <span class="pct" id="pctA">50%</span></span>
      <div class="rope"><span id="rope" style="width:50%"></span></div>
      <span class="side b"><svg width="14" height="17" viewBox="0 0 54 64"><path d="M4 2h46v30c0 16-12 26-23 30C16 58 4 48 4 32z" fill="#b5452f"/></svg><span id="nameB">Dogs</span> <span class="pct" id="pctB">50%</span></span>
    </div>
    <div class="you" id="you"></div>
  </header>
  <div class="map-wrap">
    <canvas id="map"></canvas>
    <div class="tip" id="tip"></div>
  </div>
  <div class="tray">
    <ol class="feed" id="feed" aria-live="polite"></ol>
    <div class="coach" id="coach" hidden><p><b></b><span></span></p><button type="button" id="skipTraining">Skip training</button></div>
    <p class="status" id="status"></p>
    <p class="day-end" id="dayEnd" hidden><button type="button">Skip to midnight</button></p>
    <div class="cards" id="cards"></div>
  </div>
  <section class="pick" id="pick">
    <p>Today's feud splits the subreddit in two. Pick a side, then take the island for it.</p>
    <h2 class="q" id="pickQuestion">Cats or dogs?</h2>
    <div class="sides">
      <button type="button" data-side="a"><svg viewBox="0 0 54 64"><path d="M4 2h46v30c0 16-12 26-23 30C16 58 4 48 4 32z" fill="#2f5d8a" stroke="#3a2a1c" stroke-width="2"/><g class="glyph"><path d="M17 24l4-9 4 7h4l4-7 4 9c3 9-2 17-10 17s-13-8-10-17z" fill="none" stroke="#efe3c8" stroke-width="2"/></g></svg><b>Cats</b><small>&nbsp;</small></button>
      <button type="button" data-side="b"><svg viewBox="0 0 54 64"><path d="M4 2h46v30c0 16-12 26-23 30C16 58 4 48 4 32z" fill="#b5452f" stroke="#3a2a1c" stroke-width="2"/><g class="glyph"><path d="M16 18c-4 2-4 10 0 12M38 18c4 2 4 10 0 12M18 16c3-3 15-3 18 0 3 8 1 20-9 22-10-2-12-14-9-22z" fill="none" stroke="#efe3c8" stroke-width="2"/></g></svg><b>Dogs</b><small>&nbsp;</small></button>
    </div>
    <p class="next" id="pickNote" role="status"></p>
    <p class="next" id="pickNext"></p>
  </section>
</main>
<script type="module" src="./game.js"></script>
</body>
</html>
