<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feudlands</title>
<style>
  :root { --parchment: #efe3c8; --ink: #3a2a1c; --ink-soft: #7a6347; --a: #2f5d8a; --b: #b5452f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--parchment); color: var(--ink); font-family: 'IM Fell English', Georgia, serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }
  .brand { font-family: 'IM Fell English SC', serif; font-size: 18px; color: var(--ink-soft); margin: 0; }
  h1 { font-weight: 400; font-size: 40px; line-height: 1.05; margin: 0; }
  .sides { display: flex; align-items: center; gap: 10px; font-size: 18px; }
  .sides svg { width: 22px; height: 26px; flex: none; }
  .rope { flex: 1; height: 8px; background: var(--b); }
  .rope span { display: block; height: 100%; width: 50%; background: var(--a); }
  p { margin: 0; font-style: italic; color: var(--ink-soft); font-size: 16px; }
  button { align-self: flex-start; font: inherit; font-size: 20px; color: var(--parchment); background: var(--ink); border: 0; padding: 10px 22px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
<script type="module" src="./splash.ts"></script>
</head>
<body>
<main>
  <p class="brand">Feudlands</p>
  <h1>Cats or dogs?</h1>
  <div class="sides">
    <svg viewBox="0 0 54 64" aria-hidden="true"><path d="M4 2h46v30c0 16-12 26-23 30C16 58 4 48 4 32z" fill="#2f5d8a"/></svg>Cats
    <div class="rope"><span></span></div>
    Dogs<svg viewBox="0 0 54 64" aria-hidden="true"><path d="M4 2h46v30c0 16-12 26-23 30C16 58 4 48 4 32z" fill="#b5452f"/></svg>
  </div>
  <p>The subreddit splits in two and fights for one island. Your arguments in the comments are your side's battle cries.</p>
  <button type="button" id="join">Join the war</button>
</main>
</body>
</html>
